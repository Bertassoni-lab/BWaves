<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel · Vitrine BW</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:image" content="https://bw.okgo.dev.br/assets/compartilhar.jpg">
<link rel="icon" href="assets/logo-bw.png">
<meta name="theme-color" content="#0c0b09">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20261018a">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><img class="brand-logo" src="assets/logo-bw.png" alt="Business Wave"><b>Painel</b></a>
    <nav><a class="btn sm ghost" href="./" target="_blank" rel="noopener">Abrir vitrine</a><button class="btn sm ghost" id="sair" type="button" hidden>Sair</button></nav>
  </div>
</header>

<main class="wrap" style="padding-block:28px 64px">
  <section id="login" hidden style="max-width:420px;display:grid;gap:14px">
    <h1 style="font-style:italic;font-size:44px">Entrar no painel</h1>
    <form class="form" id="lf">
      <div class="field"><label for="le">E-mail</label><input id="le" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <div class="msg err" id="lerr" hidden></div>
      <div><button class="btn" type="submit">Entrar</button></div>
    </form>
  </section>

  <section id="app" hidden style="display:grid;gap:16px">
    <div class="tabs" role="group" aria-label="Área do painel">
      <button class="tab" data-area="cadastros" aria-pressed="true">Cadastros</button>
      <button class="tab" data-area="pesquisa" aria-pressed="false">Pesquisa</button>
    </div>
    <div id="areaCadastros" style="display:grid;gap:16px">
    <div class="sec-head" style="margin:0">
      <div><h2>Cadastros</h2><p id="resumo"></p></div>
      <div class="acts">
        <button class="btn sm" id="aprovarTodos" type="button" hidden>Aprovar todos</button>
        <button class="btn sm ghost" id="csv" type="button">Baixar lista (CSV)</button>
      </div>
    </div>
    <div class="tabs" role="group" aria-label="Situação">
      <button class="tab" data-s="pendente" aria-pressed="true">Esperando aprovação</button>
      <button class="tab" data-s="aprovado" aria-pressed="false">Na vitrine</button>
      <button class="tab" data-s="recusado" aria-pressed="false">Ocultos</button>
    </div>
    <div class="adm-list" id="lista"></div>
    <div class="empty" id="vazio" hidden></div>
    <p class="meta" id="atual"></p>
    </div>

    <div id="areaPesquisa" hidden style="display:grid;gap:18px">
      <div class="sec-head" style="margin:0">
        <div><h2>Pesquisa · 5ª edição</h2><p id="pTotal"></p></div>
        <div class="acts">
          <a class="btn sm ghost" href="pesquisa.html" target="_blank" rel="noopener">Abrir a pesquisa</a>
          <button class="btn sm ghost" id="pAtualizar" type="button">Atualizar</button>
          <button class="btn sm ghost" id="pCsv" type="button">Baixar planilha (CSV)</button>
        </div>
      </div>
      <div id="pResumo"></div>
      <div id="pAbertas"></div>
      <div id="pTodas"></div>
    </div>
  </section>
</main>

<dialog id="ed" aria-labelledby="edT">
  <form class="dlg" id="ef" novalidate>
    <button class="x" type="button" aria-label="Fechar" data-close>×</button>
    <h2 id="edT" style="font-size:30px">Editar perfil</h2>
    <div class="field">
      <span class="l">Logo ou foto</span>
      <div class="preview"><span id="eLogoBox"></span><input id="eLogo" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Trocar logo ou foto"></div>
      <button class="btn sm ghost" type="button" id="eLogoTirar" style="justify-self:start">Remover foto</button>
    </div>
    <div class="two">
      <div class="field"><label for="e_responsavel">Nome</label><input id="e_responsavel" maxlength="80"></div>
      <div class="field"><label for="e_nome_negocio">Negócio</label><input id="e_nome_negocio" maxlength="80"></div>
    </div>
    <div class="two">
      <div class="field"><label for="e_whatsapp">WhatsApp</label><input id="e_whatsapp" maxlength="20" inputmode="tel"></div>
      <div class="field"><label for="e_segmento">Segmento</label><select id="e_segmento"></select></div>
    </div>
    <div class="field"><label for="e_oferta_bw">Oferta exclusiva BW</label><input id="e_oferta_bw" maxlength="160"></div>
    <div class="field"><label for="e_oferta_link">Link da oferta</label><span class="h">O botão “Quero essa oferta” leva para cá. Vazio, abre o WhatsApp.</span><input id="e_oferta_link" maxlength="300" inputmode="url"></div>
    <div class="two">
      <div class="field"><label for="e_instagram">Instagram</label><input id="e_instagram" maxlength="60"></div>
      <div class="field"><label for="e_cidade">Cidade</label><input id="e_cidade" maxlength="60"></div>
    </div>
    <div class="field"><label for="e_descricao">O que o negócio faz</label><textarea id="e_descricao" maxlength="400" style="min-height:70px"></textarea></div>
    <div class="two">
      <div class="field"><label for="e_ofereco">Ofereço</label><input id="e_ofereco" maxlength="200"></div>
      <div class="field"><label for="e_preciso">Procuro</label><input id="e_preciso" maxlength="200"></div>
    </div>
    <div class="two">
      <div class="field"><label for="e_site">Site</label><input id="e_site" maxlength="200"></div>
      <div class="field"><label for="e_email">E-mail</label><input id="e_email" type="email" maxlength="120"></div>
    </div>
    <div class="field"><label for="e_tipo">Tipo</label><select id="e_tipo"><option value="participante">Participante</option><option value="patrocinadora">Patrocinadora</option><option value="parceira">Parceira</option></select></div>
    <div class="msg err" id="eErr" hidden></div>
    <div class="acts"><button class="btn" type="submit" id="eSave">Salvar alterações</button><button class="btn ghost" type="button" data-close>Cancelar</button></div>
  </form>
</dialog>

<script src="assets/supabase.js"></script>
<script src="assets/config.js?v=20261015b"></script>
<script src="assets/bw.js?v=20261017a"></script>
<script src="assets/pesquisa.js?v=20261018a"></script>
<script>
(async function () {
  const { sb, DEMO, C, esc, logoHTML, waLink } = BW;
  const $ = s => document.querySelector(s);
  let perfis = [], filtro = "pendente", confirmando = false;
  const TIPO = { participante: "Participante", patrocinadora: "Patrocinadora", parceira: "Parceira" };

  async function carregar() {
    if (DEMO) {
      if (!perfis.length) perfis = (await BW.listarVitrine()).map((p, i) => ({ ...p, status: i < 2 ? "pendente" : "aprovado", email: "exemplo@email.com", token_edicao: crypto.randomUUID(), created_at: new Date().toISOString() }));
    } else {
      const a = await sb.from("bw_perfis").select("*").order("created_at", { ascending: false });
      if (a.error) throw a.error; perfis = a.data;
    }
    render();
    $("#atual").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + " · atualiza sozinho a cada 30 segundos";
  }

  function render() {
    const c = s => perfis.filter(p => p.status === s).length;
    const pend = c("pendente");
    $("#resumo").textContent = `${pend} esperando aprovação · ${c("aprovado")} na vitrine · ${c("recusado")} ocultos`;
    document.querySelector('.tab[data-s="pendente"]').textContent = `Esperando aprovação (${pend})`;
    const at = $("#aprovarTodos"); at.hidden = !(filtro === "pendente" && pend > 1);
    if (!confirmando) at.textContent = `Aprovar todos (${pend})`;
    const l = perfis.filter(p => p.status === filtro);
    $("#lista").innerHTML = l.map(p => `
      <div class="adm-item" data-id="${esc(p.id)}">
        ${logoHTML(p)}
        <div style="min-width:0;display:grid;gap:4px">
          <div><b>${esc(p.nome_negocio)}</b>${p.destaque ? ' <span class="tag sp">Destaque</span>' : ""}</div>
          <div class="meta">${esc(p.responsavel)} · ${esc(TIPO[p.tipo])} · ${esc(p.segmento)}${p.cidade ? " · " + esc(p.cidade) : ""}</div>
          <div class="meta">${esc(p.email || "")}${p.whatsapp ? " · " + esc(p.whatsapp) : ""}${p.instagram ? " · @" + esc(p.instagram) : ""}</div>
          ${p.oferta_bw ? `<div class="mini-offer"><b>Oferta BW</b> ${esc(p.oferta_bw)}${p.oferta_link ? ` · <a href="${esc(BW.safeUrl(p.oferta_link))}" target="_blank" rel="noopener">link da oferta</a>` : ""}</div>` : ""}
          ${p.descricao ? `<div style="font-size:14px">${esc(p.descricao)}</div>` : ""}
          ${p.preciso ? `<div class="meta">Procura: ${esc(p.preciso)}</div>` : ""}
        </div>
        <div class="acts">
          <button class="btn sm ghost" data-a="editar">Editar</button>
          ${p.status !== "aprovado" ? `<button class="btn sm" data-a="aprovar">${p.status === "recusado" ? "Voltar para a vitrine" : "Aprovar"}</button>` : ""}
          ${p.status !== "recusado" ? `<button class="btn sm ghost" data-a="ocultar">Ocultar</button>` : ""}
          ${p.status === "aprovado" ? `<button class="btn sm ghost" data-a="destaque">${p.destaque ? "Tirar destaque" : "Destacar"}</button>` : ""}
          ${p.whatsapp ? `<a class="btn sm ghost" href="${esc(waLink(p.whatsapp, `Oi, ${p.responsavel}! Aqui é do Business Wave, sobre o seu perfil na Vitrine BW.`))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
          ${p.whatsapp && p.token_edicao ? `<a class="btn sm ghost" href="${esc(waLink(p.whatsapp, `Oi, ${p.responsavel}! Aqui é do Business Wave. Este é o seu painel na Vitrine BW: por ele você edita seu perfil, troca a foto e vê se já está na vitrine. O link é pessoal, não compartilhe. ${(C.SITE_URL || location.origin)}/painel.html#${p.token_edicao}`))}" target="_blank" rel="noopener">Enviar link do painel</a>` : ""}
        </div>
      </div>`).join("");
    const vz = $("#vazio"); vz.hidden = l.length > 0;
    vz.innerHTML = filtro === "pendente" ? "<b>Nenhum cadastro esperando.</b>Os novos aparecem aqui sozinhos." : filtro === "aprovado" ? "<b>A vitrine ainda está vazia.</b>Aprove os cadastros para eles aparecerem." : "<b>Nenhum perfil oculto.</b>";
  }

  function avisar(e) { console.error(e); const m = document.createElement("div"); m.className = "msg err"; m.textContent = "Não salvou: " + (e.message || e) + ". Tente de novo."; $("#lista").prepend(m); setTimeout(() => m.remove(), 6000); }

  async function atualizar(ids, patch) {
    if (!DEMO) { const { error } = await sb.from("bw_perfis").update(patch).in("id", ids); if (error) return avisar(error); }
    perfis.forEach(p => { if (ids.includes(String(p.id))) Object.assign(p, patch); }); render();
  }

  $("#lista").addEventListener("click", e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const id = b.closest(".adm-item").dataset.id, p = perfis.find(x => String(x.id) === id);
    if (b.dataset.a === "aprovar") atualizar([id], { status: "aprovado" });
    if (b.dataset.a === "ocultar") atualizar([id], { status: "recusado", destaque: false });
    if (b.dataset.a === "destaque") atualizar([id], { destaque: !p.destaque });
    if (b.dataset.a === "editar") abrirEditor(p);
  });
  $("#aprovarTodos").addEventListener("click", async () => {
    const ids = perfis.filter(p => p.status === "pendente").map(p => String(p.id));
    const b = $("#aprovarTodos");
    if (!confirmando) { confirmando = true; b.textContent = `Confirmar: aprovar ${ids.length}`; setTimeout(() => { confirmando = false; render(); }, 5000); return; }
    confirmando = false; await atualizar(ids, { status: "aprovado" });
  });

  // edição de perfil
  const CAMPOS = ["responsavel","nome_negocio","whatsapp","segmento","oferta_bw","oferta_link","instagram","cidade","descricao","ofereco","preciso","site","email","tipo"];
  BW.SEGMENTOS.forEach(s => $("#e_segmento").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`));
  let editando = null, novoLogo = null, tirarLogo = false;
  function mostrarLogo(src, nome) {
    $("#eLogoBox").innerHTML = src ? `<img class="logo" src="${esc(src)}" alt="">` : `<span class="logo">${esc(BW.iniciais(nome))}</span>`;
  }
  function abrirEditor(p) {
    editando = p; novoLogo = null; tirarLogo = false; $("#eErr").hidden = true; $("#eLogo").value = "";
    CAMPOS.forEach(c => { const el = $("#e_" + c); el.value = p[c] ?? ""; });
    if (p.segmento && ![...$("#e_segmento").options].some(o => o.value === p.segmento)) $("#e_segmento").insertAdjacentHTML("beforeend", `<option>${esc(p.segmento)}</option>`), $("#e_segmento").value = p.segmento;
    mostrarLogo(p.logo_url, p.nome_negocio);
    $("#ed").showModal();
  }
  $("#eLogo").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { novoLogo = await BW.reduzirFoto(f); tirarLogo = false; mostrarLogo(URL.createObjectURL(novoLogo), ""); }
    catch (_) { const er = $("#eErr"); er.textContent = "Não consegui ler essa imagem. Tente um JPG ou PNG."; er.hidden = false; }
  });
  $("#eLogoTirar").addEventListener("click", () => { novoLogo = null; tirarLogo = true; $("#eLogo").value = ""; mostrarLogo("", $("#e_nome_negocio").value); });
  $("#ed").addEventListener("click", e => { if (e.target.closest("[data-close]") || e.target === e.currentTarget) e.currentTarget.close(); });
  $("#ef").addEventListener("submit", async e => {
    e.preventDefault();
    const er = $("#eErr"); er.hidden = true;
    const v = c => $("#e_" + c).value.trim();
    if (!v("responsavel") || !v("nome_negocio") || !v("segmento")) { er.textContent = "Nome, negócio e segmento não podem ficar vazios."; er.hidden = false; return; }
    const patch = {};
    CAMPOS.forEach(c => { patch[c] = v(c) || null; });
    patch.whatsapp = BW.soDigitos(v("whatsapp")) || null;
    patch.instagram = BW.ig(v("instagram")) || null;
    patch.oferta_link = BW.linkOferta(v("oferta_link"));
    if (patch.oferta_link === null) { er.textContent = "Confira o link da oferta: o endereço da página, sem espaços."; er.hidden = false; return; }
    patch.oferta_link = patch.oferta_link || null;
    if (!patch.email) patch.email = editando.email; // e-mail é obrigatório no banco
    const btn = $("#eSave"); btn.disabled = true; btn.textContent = "Salvando…";
    try {
      if (novoLogo && !DEMO) {
        const path = `${editando.id}-${Date.now()}.jpg`;
        const up = await sb.storage.from("bw-logos").upload(path, novoLogo, { contentType: "image/jpeg", upsert: false });
        if (up.error) throw up.error;
        patch.logo_url = sb.storage.from("bw-logos").getPublicUrl(path).data.publicUrl;
      } else if (novoLogo && DEMO) patch.logo_url = "";
      if (tirarLogo) patch.logo_url = null;
      if (!DEMO) { const { error } = await sb.from("bw_perfis").update(patch).eq("id", editando.id); if (error) throw error; }
      Object.assign(editando, patch); render(); $("#ed").close();
    } catch (err) { console.error(err); er.textContent = "Não salvou: " + (err.message || err) + ". Tente de novo."; er.hidden = false; }
    finally { btn.disabled = false; btn.textContent = "Salvar alterações"; }
  });
  document.querySelectorAll(".tab[data-s]").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab[data-s]").forEach(x => x.setAttribute("aria-pressed", String(x === t))); filtro = t.dataset.s; render();
  }));

  // lista para a organização (abre como arquivo no navegador)
  $("#csv").addEventListener("click", () => {
    const cols = ["nome_negocio","responsavel","tipo","segmento","cidade","whatsapp","email","instagram","site","oferta_bw","oferta_link","ofereco","preciso","status","created_at"];
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = "﻿" + cols.join(";") + "\n" + perfis.map(p => cols.map(c => q(p[c])).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "vitrine-bw-cadastros.csv"; document.body.appendChild(a); a.click(); a.remove();
  });

  // pesquisa de satisfacao: resumo, respostas abertas, todas as respostas e planilha
  const P = BW_PESQUISA;
  let respostas = null, apagando = null;
  const num = v => v === null || v === undefined ? "—" : v.toLocaleString("pt-BR");
  const deram = n => `${n} ${n === 1 ? "deu" : "deram"}`;
  const quem = x => `${x.nome ? esc(x.nome) : "Anônima"} · ${esc(P.dataBR(x.criado_em))}`;
  function avisarPesquisa(e) { console.error(e); const m = document.createElement("div"); m.className = "msg err"; m.textContent = "Não deu certo: " + (e.message || e) + ". Tente de novo."; $("#areaPesquisa").prepend(m); setTimeout(() => m.remove(), 6000); }

  async function carregarPesquisa() {
    if (DEMO) { if (!respostas) respostas = P.exemplos.map(x => ({ ...x })); }
    else {
      const a = await sb.from("bw_pesquisa").select("*").order("criado_em", { ascending: false });
      if (a.error) throw a.error; respostas = a.data;
    }
    renderPesquisa();
  }

  function renderPesquisa() {
    const r = P.resumo(respostas);
    $("#pTotal").textContent = r.total === 1 ? "1 resposta" : `${r.total} respostas`;
    $("#pCsv").disabled = !r.total;
    if (!r.total) {
      $("#pResumo").innerHTML = `<div class="empty"><b>Nenhuma resposta ainda.</b>Mande o link ${esc((C.SITE_URL || location.origin) + "/pesquisa.html")} no grupo das participantes.</div>`;
      $("#pAbertas").innerHTML = $("#pTodas").innerHTML = "";
      return;
    }
    const rec = r.recomendacao, pq = c => `${P.perguntas[c].n}. ${esc(P.perguntas[c].curto)}`;
    $("#pResumo").innerHTML = `
      <div class="p-nums">
        <div class="p-num"><span>Respostas</span><b>${r.total}</b></div>
        <div class="p-num"><span>Experiência geral</span><b>${num(r.geral.media)}<small>/10</small></b><span>de ${r.geral.n} ${r.geral.n === 1 ? "resposta" : "respostas"}</span></div>
        <div class="p-num"><span>Recomendaria</span><b>${num(rec.media)}<small>/10</small></b><span>NPS ${num(rec.nps)} · ${deram(rec.promotoras)} 9 ou 10, ${deram(rec.detratoras)} de 0 a 6</span></div>
      </div>
      <p class="meta" style="margin:10px 0 0">NPS é a % de quem deu 9 ou 10 menos a % de quem deu de 0 a 6. Vai de −100 a 100.</p>
      <div class="p-grade" style="margin-top:14px">${Object.entries(r.escolhas).map(([c, e]) => `
        <div class="p-q" data-q="${c}">
          <h3>${pq(c)}</h3>
          <span class="meta">${e.n} de ${r.total} responderam${P.perguntas[c].tipo === "varias" ? " · dava para marcar mais de uma" : ""}</span>
          ${e.opcoes.map(o => `<div class="barra" title="${esc(o.texto)}: ${o.qtd} (${o.pct}%)"><b>${esc(o.texto)}</b><span>${o.qtd} · ${o.pct}%</span><i><s style="width:${o.pct}%"></s></i></div>`).join("")}
          ${e.outros.length ? `<div class="meta">Outro: ${e.outros.map(esc).join(" · ")}</div>` : ""}
        </div>`).join("")}</div>`;
    $("#pAbertas").innerHTML = `<h3 class="p-tit">Respostas abertas</h3><div class="p-grade">${P.ordem.filter(c => P.perguntas[c].tipo === "texto").map(c => {
      const lista = respostas.filter(x => x[c]);
      return `<div class="p-q"><h3>${pq(c)}</h3>${lista.length ? lista.map(x => `<blockquote class="p-cit">${esc(x[c])}<span class="meta">${quem(x)}</span></blockquote>`).join("") : '<span class="meta">Ninguém respondeu esta ainda.</span>'}</div>`;
    }).join("")}</div>`;
    $("#pTodas").innerHTML = `<h3 class="p-tit">Todas as respostas</h3>` + respostas.map(x => `
      <details class="p-resp" data-id="${esc(x.id)}"><summary>${quem(x)} · recomendaria ${num(x.recomendaria)}/10</summary>
        <dl>${P.ordem.filter(c => c !== "nome").map(c => `<dt>${pq(c)}</dt><dd>${esc(P.rotulo(c, x[c])) || "—"}${x[c + "_outro"] ? " (" + esc(x[c + "_outro"]) + ")" : ""}</dd>`).join("")}</dl>
        <button class="btn sm ghost" type="button" data-apagar>Apagar</button>
      </details>`).join("");
  }

  // Apagar pede dois toques, como o "Aprovar todos": a resposta nao volta.
  $("#pTodas").addEventListener("click", async e => {
    const bt = e.target.closest("[data-apagar]"); if (!bt) return;
    const id = bt.closest("details").dataset.id;
    if (apagando !== id) {
      apagando = id; bt.textContent = "Confirmar: apagar";
      setTimeout(() => { if (apagando === id) { apagando = null; bt.textContent = "Apagar"; } }, 5000);
      return;
    }
    apagando = null;
    if (!DEMO) {
      const { data, error } = await sb.from("bw_pesquisa").delete().eq("id", id).select("id");
      if (error || !data.length) return avisarPesquisa(error || "a resposta não foi apagada");
    }
    respostas = respostas.filter(x => String(x.id) !== id); renderPesquisa();
  });
  $("#pCsv").addEventListener("click", () => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([P.csv(respostas || [])], { type: "text/csv;charset=utf-8" }));
    a.download = "pesquisa-bw-5a-edicao.csv"; document.body.appendChild(a); a.click(); a.remove();
  });
  $("#pAtualizar").addEventListener("click", () => { if (!DEMO) respostas = null; carregarPesquisa().catch(avisarPesquisa); });
  document.querySelectorAll(".tab[data-area]").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab[data-area]").forEach(x => x.setAttribute("aria-pressed", String(x === t)));
    const pesquisa = t.dataset.area === "pesquisa";
    $("#areaCadastros").hidden = pesquisa; $("#areaPesquisa").hidden = !pesquisa;
    if (pesquisa && !respostas) carregarPesquisa().catch(avisarPesquisa);
  }));

  async function entrar() {
    $("#login").hidden = true; $("#app").hidden = false; $("#sair").hidden = DEMO;
    try { await carregar(); } catch (e) { avisar(e); }
    setInterval(() => { if (!document.hidden && !confirmando && !$("#ed").open) carregar().catch(() => {}); }, 30000);
  }
  if (DEMO) return entrar();
  const { data: { session } } = await sb.auth.getSession();
  if (session) entrar(); else $("#login").hidden = false;
  $("#lf").addEventListener("submit", async e => {
    e.preventDefault(); const er = $("#lerr"); er.hidden = true;
    const { error } = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
    if (error) { er.textContent = "E-mail ou senha incorretos."; er.hidden = false; return; }
    entrar();
  });
  $("#sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
})();
</script>
</body>
</html>
